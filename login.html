<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PÁRCHATE - Acceso</title>
    <link rel="stylesheet" href="Estilos/login.css">
</head>
<body>

    <header class="login-navbar">
        <div class="logo"><a href="inicio.html">PÁRCHATE</a></div>
    </header>

    <div class="auth-container">
        <div class="auth-header">
            <h2 id="auth-title">Crea tu cuenta</h2>
            <p id="auth-subtitle">Con tu cuenta de PÁRCHATE podrás guardar eventos, reservar boletas y personalizar tu experiencia.</p>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-login">Iniciar Sesión</button>
            <button class="tab-btn" id="tab-register">Registrarse</button>
        </div>

        <form id="form-auth">
            <!-- CAMPOS EXTRAS DE REGISTRO -->
            <div class="form-group" id="group-nombre" style="display: none;">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Ej: Tomas Morales">
            </div>

            <div class="form-group">
                <label for="identificador" id="label-identificador">Correo Electrónico o Usuario</label>
                <input type="text" id="identificador" placeholder="nombre@correo.com o usuario" required>
            </div>

            <div class="form-group" id="group-telefono" style="display: none;">
                <label for="telefono">Teléfono / WhatsApp</label>
                <input type="tel" id="telefono" placeholder="Ej: 300 123 4567">
            </div>

            <div class="form-group" id="group-comuna" style="display: none;">
                <label for="comuna-pref">Tu Comuna Favorita</label>
                <select id="comuna-pref">
                    <option value="">Selecciona tu comuna principal</option>
                    <option value="Laureles_Estadio">Laureles - Estadio</option>
                    <option value="El_poblado">El Poblado</option>
                    <option value="San_javier">San Javier (Comuna 13)</option>
                    <option value="Manrique">Manrique</option>
                    <option value="Aranjuez">Aranjuez</option>
                    <option value="Belen">Belén</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Al menos 6 caracteres" required>
            </div>

            <div class="legal-check" id="group-legal" style="display: none;">
                <input type="checkbox" id="acepta-terminos" required>
                <label for="acepta-terminos">Acepto los Términos de Servicio y la Política de Privacidad de PÁRCHATE Medellín.</label>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit-text">Continuar</button>
        </form>

        <div class="social-divider">
            <span>O CONTINÚA CON</span>
        </div>

        <button class="btn-social" type="button" onclick="alert('Función de Google en desarrollo')">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Continuar con Google
        </button>

        <div id="status-msg" class="status-msg"></div>
    </div>

    <div style="text-align: center;">
        <a href="inicio.html" class="back-link">← Volver a la página principal</a>
    </div>

    <script src="Logica/login.js"></script>
</body>
</html>
